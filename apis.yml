aid: machine0
name: Machine0
description: >-
  Machine0 is a Y Combinator (S26)-backed infrastructure company, operated by
  Fundamental Software, that provides persistent, on-demand cloud virtual
  machines driven entirely from the command line and optimized for AI agents.
  The machine0 CLI ("Cloud VMs from the CLI") and a remote Model Context
  Protocol (MCP) server let you create, provision, snapshot, suspend and SSH
  into dedicated VMs — NixOS or Ubuntu, up to 60 vCPU / 240GB RAM with optional
  GPUs — across five regions (US East/West, UK, EU, Asia) with static IPs, HTTPS
  endpoints and per-minute billing. Suspend a VM to freeze its state and stop
  compute charges. Every CLI command supports JSON output and the MCP server
  exposes the same machine, image, SSH-key and remote-exec operations to agents.
